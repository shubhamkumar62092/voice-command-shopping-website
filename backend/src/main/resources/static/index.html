<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Listful — Voice Shopping Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

  <main class="receipt">
    <header class="receipt__head">
      <p class="eyebrow" id="dateStamp">No. 04 — Today's List</p>
      <h1 class="wordmark">Listful</h1>
      <p class="tagline">Say it, and it's on the list.</p>
    </header>

    <section class="mic-bay" aria-label="Voice input">
      <div class="mic-wrap">
        <div class="mic-ring mic-ring--1" id="ring1"></div>
        <div class="mic-ring mic-ring--2" id="ring2"></div>
        <button id="micButton" class="mic-btn" type="button" aria-pressed="false" aria-label="Tap to speak a command">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
      </div>

      <div class="waveform" id="waveform" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <p class="mic-status" id="micStatus">Tap to speak</p>

      <div class="lang-row">
        <label for="langSelect">Language</label>
        <select id="langSelect">
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="es-ES">Español</option>
          <option value="fr-FR">Français</option>
          <option value="hi-IN">हिन्दी</option>
          <option value="de-DE">Deutsch</option>
        </select>
      </div>

      <p class="transcript" id="transcriptLine" aria-live="polite">&nbsp;</p>
    </section>

    <section class="manual-add">
      <form id="manualForm" autocomplete="off">
        <input type="text" id="manualInput" placeholder="or type a command — “add 2 bottles of water”" aria-label="Type a command" />
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="swap-section" id="swapSection" hidden aria-live="polite">
      <p class="ticket-label">Swap suggestion</p>
      <div id="swapChips" class="chip-row"></div>
    </section>

    <section class="suggestions" id="suggestions" hidden>
      <p class="ticket-label">Smart Suggestions</p>
      <div id="suggestionChips" class="chip-row"></div>
    </section>

    <div class="perf-divider" aria-hidden="true"></div>

    <section class="list-section">
      <div class="list-head">
        <p class="ticket-label">Your List</p>
        <div class="list-head__right">
          <span class="count-badge" id="countBadge">0 items</span>
          <button class="clear-btn" id="clearBtn" type="button" title="Clear entire list">Clear</button>
        </div>
      </div>

      <div class="stats-strip" id="statsStrip" hidden>
        <div class="stats-bar-track">
          <div class="stats-bar-fill" id="statsBarFill"></div>
        </div>
        <span class="stats-label" id="statsLabel">0 of 0 picked up</span>
      </div>

      <div id="listSkeleton" class="skeleton-group" hidden>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
      </div>

      <div id="aisleContainer">
        <div class="empty-state" id="emptyState">
          <svg viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 14h32l-3 22a3 3 0 0 1-3 3H14a3 3 0 0 1-3-3L8 14Z"/>
            <path d="M16 14V10a8 8 0 0 1 16 0v4" stroke-linecap="round"/>
          </svg>
          <p>Your list is empty.<br>Try saying <span class="voice-eg">“add milk.”</span></p>
        </div>
      </div>

      <div class="purchased-fold" id="purchasedFold" hidden>
        <button class="purchased-toggle" id="purchasedToggle" type="button" aria-expanded="false">
          <span class="purchased-toggle__chevron">▸</span>
          <span id="purchasedToggleLabel">Picked up (0)</span>
        </button>
        <ul class="list purchased-list" id="purchasedList" hidden></ul>
      </div>
    </section>

    <footer class="receipt__foot">
      <p class="zigzag" aria-hidden="true"></p>
      <p class="foot-note">Spring Boot · MySQL · voice by your browser</p>
    </footer>
  </main>

<script src="app.js"></script>
</body>
</html>
